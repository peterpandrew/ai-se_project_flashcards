<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Andrew Pan" />
    <meta
      name="description"
      content="A flashcard app to help you study and memorize information."
    />
    <meta
      name="keywords"
      content="study aids, flashcards, learning materials"
    />
    <title>Flash Cards App</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="assets/css/index.css" />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li class="nav__item">
            <a href="#home" class="nav__link">My Decks</a>
          </li>
          <li class="nav__item">
            <a href="#about" class="nav__link">About</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="page__main-content">
      <section class="gallery" id="home">
        <div class="gallery__header">
          <h2 class="gallery__title">My Decks</h2>
        </div>

        <template id="card-template">
          <li class="card">
            <h3 class="card__title"></h3>
            <div class="card__row">
              <button
                class="card__count"
                type="button"
                aria-label="Open this flashcard deck"
              ></button>
              <button
                class="card__btn card__btn_type_delete"
                type="button"
                aria-label="Delete this deck"
              ></button>
            </div>
          </li>
        </template>

        <ul class="gallery__list">
          <li class="gallery__item">
            <button type="button" class="gallery__new-card-btn">
              + New Deck
            </button>
          </li>
        </ul>
      </section>

      <section class="new-deck-view" id="new-deck-view" hidden>
        <h2 class="new-deck-view__title">New Deck</h2>
        <form class="new-deck-view__form" id="new-deck-form">
          <fieldset class="new-deck-view__colors">
            <legend class="new-deck-view__label">Pick the deck color</legend>
            <label class="new-deck-view__color-option" for="green">
              <input
                class="new-deck-view__color-input"
                type="radio"
                id="green"
                name="deck-color"
                value="#64d583"
                aria-label="Green"
                checked
              />
              <span
                class="new-deck-view__swatch new-deck-view__swatch_color_green"
                aria-hidden="true"
              ></span>
              <span class="new-deck-view__visually-hidden">Green</span>
            </label>
            <label class="new-deck-view__color-option" for="blue">
              <input
                class="new-deck-view__color-input"
                type="radio"
                id="blue"
                name="deck-color"
                value="#91a8f9"
                aria-label="Blue"
              />
              <span
                class="new-deck-view__swatch new-deck-view__swatch_color_blue"
                aria-hidden="true"
              ></span>
              <span class="new-deck-view__visually-hidden">Blue</span>
            </label>
            <label class="new-deck-view__color-option" for="orange">
              <input
                class="new-deck-view__color-input"
                type="radio"
                id="orange"
                name="deck-color"
                value="#ee955e"
                aria-label="Orange"
              />
              <span
                class="new-deck-view__swatch new-deck-view__swatch_color_orange"
                aria-hidden="true"
              ></span>
              <span class="new-deck-view__visually-hidden">Orange</span>
            </label>
            <label class="new-deck-view__color-option" for="pink">
              <input
                class="new-deck-view__color-input"
                type="radio"
                id="pink"
                name="deck-color"
                value="#ee92d7"
                aria-label="Pink"
              />
              <span
                class="new-deck-view__swatch new-deck-view__swatch_color_pink"
                aria-hidden="true"
              ></span>
              <span class="new-deck-view__visually-hidden">Pink</span>
            </label>
            <label class="new-deck-view__color-option" for="purple">
              <input
                class="new-deck-view__color-input"
                type="radio"
                id="purple"
                name="deck-color"
                value="#aa8ef0"
                aria-label="Purple"
              />
              <span
                class="new-deck-view__swatch new-deck-view__swatch_color_purple"
                aria-hidden="true"
              ></span>
              <span class="new-deck-view__visually-hidden">Purple</span>
            </label>
            <label class="new-deck-view__color-option" for="yellow">
              <input
                class="new-deck-view__color-input"
                type="radio"
                id="yellow"
                name="deck-color"
                value="#f5d770"
                aria-label="Yellow"
              />
              <span
                class="new-deck-view__swatch new-deck-view__swatch_color_yellow"
                aria-hidden="true"
              ></span>
              <span class="new-deck-view__visually-hidden">Yellow</span>
            </label>
          </fieldset>
          <label class="new-deck-view__field" for="new-deck-json">
            Write the JSON arrray of cards so that it matches this schema
            <textarea
              class="new-deck-view__textarea"
              id="new-deck-json"
              name="deck-json"
              rows="10"
              placeholder="Paste deck JSON here"
              spellcheck="false"
            ></textarea>
          </label>
          <button class="new-deck-view__submit" type="submit" disabled>
            Create Deck
          </button>
        </form>
      </section>

      <section class="carousel" id="carousel">
        <h2 class="carousel__title"></h2>
        <div class="carousel__container">
          <ul class="carousel__cards">
            <li class="carousel__card">
              <div class="carousel__grid">
                <button
                  class="carousel__btn carousel__btn_type_left"
                  type="button"
                  aria-label="Previous card"
                ></button>
                <p class="carousel__card-text"></p>
                <button
                  class="carousel__btn carousel__btn_type_right"
                  type="button"
                  aria-label="Next card"
                ></button>
                <button
                  class="carousel__btn carousel__btn_type_flip"
                  type="button"
                  aria-label="Flip card"
                ></button>
              </div>
            </li>
          </ul>
        </div>
      </section>

      <section class="about" id="about" hidden>
        <h2 class="about__title">About</h2>
        <p class="about__text">
          Flash Cards is a study app for reviewing deck contents and mastering
          concepts.
        </p>
      </section>

      <section id="deck-view" class="gallery">
        <div class="gallery__header">
          <h2 class="gallery__title"></h2>
          <button type="button" class="gallery__practice-btn">Practice</button>
        </div>

        <template id="flashcard-template">
          <li class="flashcard">
            <p class="flashcard__text"></p>
            <div class="flashcard__actions">
              <button
                type="button"
                class="flashcard__btn flashcard__btn_type_flip"
                aria-label="Show answer"
              ></button>
              <button
                type="button"
                class="flashcard__btn flashcard__btn_type_delete"
                aria-label="Delete this flashcard"
              ></button>
            </div>
          </li>
        </template>

        <ul class="gallery__list"></ul>
      </section>

      <section class="not-found" id="not-found" hidden>
        <h2 class="not-found__title">404</h2>
        <p class="not-found__text">Not Found</p>
      </section>
    </main>

    <dialog
      class="confirmation-modal"
      id="confirmation-modal"
      aria-labelledby="confirmation-modal-title"
    >
      <h2 class="confirmation-modal__title" id="confirmation-modal-title">
        Delete this item?
      </h2>
      <p class="confirmation-modal__text">This action cannot be undone.</p>
      <div class="confirmation-modal__actions">
        <button
          class="confirmation-modal__button"
          type="button"
          data-modal-cancel
        >
          Cancel
        </button>
        <button
          class="confirmation-modal__button confirmation-modal__button_type_confirm"
          type="button"
          data-modal-confirm
        >
          Delete
        </button>
      </div>
    </dialog>

    <div
      class="modal"
      id="error-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="error-modal-title"
    >
      <div class="modal__container">
        <button
          class="modal__close-button"
          type="button"
        >
          Dismiss
        </button>
        <h2 class="modal__title" id="error-modal-title">Error</h2>
        <p class="modal__error"></p>
      </div>
    </div>

    <footer class="footer">
      <div class="footer__mobile-actions">
        <button type="button" class="footer__btn footer__btn_type_new-card">
          + New Card
        </button>
        <button type="button" class="footer__btn footer__btn_type_practice">
          Practice
        </button>
      </div>
      <p class="footer__text">&copy; 2024 Flashcards Andrew Pan</p>
    </footer>

    <script type="module" src="assets/js/index.js"></script>
  </body>
</html>
